<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 44" role="img" aria-labelledby="title desc">
  <title id="title">wirenet</title>
  <desc id="desc">The wirenet wordmark: globe mark followed by lowercase wirenet text.</desc>
  <style>
    .ink-stroke { stroke: #262626; }
    .ink-fill { fill: #262626; }
    .net-fill { fill: #4d4d4d; }
    @media (prefers-color-scheme: dark) {
      .ink-stroke { stroke: #f2f2f2; }
      .ink-fill { fill: #f2f2f2; }
      .net-fill { fill: #c7c7c7; }
    }
  </style>
  <rect width="188" height="44" fill="none"/>
  <g transform="translate(5 10)" fill="none" class="ink-stroke" stroke-width="1.4" stroke-linecap="round">
    <circle cx="12" cy="12" r="10.25"/>
    <ellipse cx="12" cy="12" rx="4.5" ry="10.25"/>
    <ellipse cx="12" cy="12" rx="10.25" ry="4.5"/>
  </g>
  <text
    x="35"
    y="29"
    class="ink-fill"
    font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    font-weight="700"
    letter-spacing="0"
  >wire</text>
  <text
    x="94"
    y="29"
    class="net-fill"
    font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    font-weight="700"
    letter-spacing="0"
  >net</text>
</svg>
